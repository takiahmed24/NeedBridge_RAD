    <rect x="26" y="13" width="7" height="7" rx="1.5" fill="#9ca3af"/>
    <rect x="36" y="13" width="7" height="7" rx="1.5" fill="#9ca3af"/>
    <rect x="26" y="23" width="7" height="7" rx="1.5" fill="#9ca3af"/>
    <rect x="36" y="23" width="7" height="7" rx="1.5" fill="#9ca3af"/>
