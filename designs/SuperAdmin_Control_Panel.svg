    <circle cx="-144" cy="20" r="10" fill="#38bdf8"/>
    <text cx="-144" x="-148" y="24" font-size="11" font-weight="800" fill="#0f172a">SA</text>
    <text x="-128" y="24" font-size="12" font-weight="600" fill="#e2e8f0">Super Admin</text>

    <rect x="0" y="0" width="100" height="38" rx="6" fill="#dc2626"/>
    <text x="50" y="24" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Logout</text>
  </g>

  <!-- ================= LEFT SIDEBAR ================= -->
