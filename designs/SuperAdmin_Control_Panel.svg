    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="100%" stop-color="#22222a" />
    </linearGradient>
    <linearGradient id="skyBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- ================= MAIN CONTAINER ================= -->
  <rect x="0" y="0" width="1440" height="900" fill="#f8fafc"/>

  <!-- ================= TOP HEADER BAR ================= -->
  <rect x="0" y="0" width="1440" height="72" fill="url(#headerGrad)"/>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#2e2e38" stroke-width="1"/>

  <!-- Brand Logo -->
  <text x="32" y="45" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5">NeedBridge</text>
  <line x1="180" y1="26" x2="180" y2="46" stroke="#4b5563" stroke-width="1.5"/>
  <text x="198" y="43" font-size="15" font-weight="600" fill="#9ca3af">Super Admin Control Panel</text>

  <!-- Header Right: User info & Logout -->
  <g transform="translate(1180, 18)">
