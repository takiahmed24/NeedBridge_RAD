<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#0f172a; font-family:'Segoe UI', Inter, -apple-system, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.08"/>
    </filter>
    <filter id="subtleShadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
