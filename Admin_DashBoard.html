<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NeedBridge - Admin Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
    background: #444;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 30px;
  }

  /* ---- fake desktop window ---- */
  .window {
    width: 1100px;
    background: #EDEDED;
    border: 1px solid #9aa5b1;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  /* ---- title bar ---- */
  .titlebar {
    height: 34px;
    background: linear-gradient(180deg, #6f92b8 0%, #4d7099 50%, #3d5c80 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6px 0 8px;
    border-bottom: 1px solid #2f4560;
  }
  .titlebar-left {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #eef2f7;
    font-size: 13px;
  }
  .titlebar-left .icon {
    width: 14px; height: 14px;
    background: #f2b632;
    border-radius: 2px;
    display: inline-block;
  }
  .titlebar-controls { display: flex; gap: 3px; }
  .titlebar-controls div {
    width: 26px; height: 22px;
    background: #dfe4ea;
    border: 1px solid #a9b3c0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: #2b2b2b;
  }
  .titlebar-controls .close {
    background: #d9502f;
    color: #fff;
    border-color: #b8391c;
  }

  /* ---- app header ---- */
  .app-header {
    background: linear-gradient(180deg, #3f6690 0%, #345880 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
  }
  .app-header .left {
    display: flex;
    align-items: baseline;
    gap: 26px;
  }
  .brand {
    font-size: 24px;
    font-weight: 700;
    color: #f3ead9;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .page-title {
    font-size: 16px;
    color: #d7e0ea;
    font-weight: 400;
  }
  .app-header .right { display: flex; gap: 10px; }
  .btn {
    font-size: 13px;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 3px;
    border: none;
    cursor: default;
  }
  .btn-profile { background: #7f97af; color: #1c2a3a; }
  .btn-logout  { background: #d9502f; color: #fff; }

  /* ---- body layout ---- */
  .body-area {
    display: flex;
  }

  .sidebar {
    width: 190px;
    background: #3d5c80;
    padding: 18px 0;
    flex-shrink: 0;
  }
  .sidebar div {
    padding: 12px 22px;
    font-size: 14.5px;
    color: #dfe6ee;
  }
  .sidebar div:first-child { font-weight: 400; }

  .main {
    flex: 1;
    background: #f2f2f0;
    padding: 18px 20px 20px 20px;
    min-height: 620px;
  }

  /* ---- stat cards ---- */
  .stats {
    display: flex;
    border: 1px dashed #b9b9b9;
    margin-bottom: 22px;
  }
  .stat-card {
    flex: 1;
    padding: 16px 18px 22px 18px;
    color: #fff;
  }
  .stat-card .label { font-size: 15px; margin-bottom: 22px; }
  .stat-card .value { font-size: 28px; font-weight: 700; }

  .c-navy  { background: #33638a; }
  .c-teal  { background: #22a179; }
  .c-red   { background: #d9542f; }
  .c-amber { background: #e0972e; }

  .section-title {
    font-size: 19px;
    font-weight: 600;
    color: #222;
    margin: 4px 0 18px 2px;
  }

  .orders-panel {
    background: #f2f2f0;
    min-height: 420px;
  }
</style>
</head>
<body>

  <div class="window">

    <div class="titlebar">
      <div class="titlebar-left">
        <span class="icon"></span>
        <span>NeedBridge - Admin Dashboard</span>
      </div>
      <div class="titlebar-controls">
        <div>—</div>
        <div>▢</div>
        <div class="close">✕</div>
      </div>
    </div>

    <div class="app-header">
      <div class="left">
        <div class="brand">NeedBridge</div>
        <div class="page-title">Admin Dashboard</div>
      </div>
      <div class="right">
        <button class="btn btn-profile">Profile</button>
        <button class="btn btn-logout">Logout</button>
      </div>
    </div>

    <div class="body-area">
      <div class="sidebar">
        <div>Dashboard</div>
        <div>Manage Vendors</div>
        <div>Manage Customers</div>
        <div>Manage Reviews</div>
        <div>Disputes</div>
        <div>Sales Report</div>
        <div>Discounts</div>
        <div>Stock Overview</div>
      </div>

      <div class="main">
        <div class="stats">
          <div class="stat-card c-navy">
            <div class="label">Total Vendors</div>
            <div class="value">0</div>
          </div>
          <div class="stat-card c-teal">
            <div class="label">Total Customers</div>
            <div class="value">0</div>
          </div>
          <div class="stat-card c-red">
            <div class="label">Total Orders</div>
            <div class="value">0</div>
          </div>
          <div class="stat-card c-amber">
            <div class="label">Total Revenue (BDT)</div>
            <div class="value">0</div>
          </div>
        </div>

        <div class="section-title">Recent Orders (Platform-wide)</div>
        <div class="orders-panel"></div>
      </div>
    </div>

  </div>

</body>
</html>
